name: Deploy FastAPI to EC2

on:
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # Build job - validate Terraform, lint (advisory), confirm app structure
  # ---------------------------------------------------------------------------
  build:
    name: Build & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies (for lint only)
        run: |
          python -m pip install --upgrade pip
          pip install flake8 || true

      - name: Lint (advisory - never blocks deploy)
        run: flake8 app/ --max-line-length=120 || true

        continue-on-error: true
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: Terraform Init (validate only)
        working-directory: terraform
        run: |
          terraform init -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ secrets.AWS_REGION }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate"

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

  # ---------------------------------------------------------------------------
  # Deploy job - provision infra, configure with Ansible, self-verify
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # -----------------------------------------------------------------------
      # Generate an ephemeral SSH key pair for this deployment
      # -----------------------------------------------------------------------
      - name: Generate SSH key pair
        run: |
          ssh-keygen -t rsa -b 4096 -f /tmp/deploy_key -N ""
          echo "SSH_PUBLIC_KEY=$(cat /tmp/deploy_key.pub)" >> $GITHUB_ENV

      # -----------------------------------------------------------------------
      # Terraform - provision / update infrastructure
      # -----------------------------------------------------------------------
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: terraform
        run: |
          terraform init -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ secrets.AWS_REGION }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate"

      - name: Terraform Apply
        working-directory: terraform
        run: |
          terraform apply -auto-approve \
            -var="project_name=${{ secrets.PROJECT_NAME }}" \
            -var="aws_region=${{ secrets.AWS_REGION }}" \
            -var="public_key=$SSH_PUBLIC_KEY"

      - name: Capture EC2 public IP
        working-directory: terraform
        run: |
          SERVER_IP=$(terraform output -raw instance_public_ip)
          echo "SERVER_IP=${SERVER_IP}" >> $GITHUB_ENV

      # -----------------------------------------------------------------------
      # Wait for SSH to become available
      # -----------------------------------------------------------------------
      - name: Wait for SSH
        run: |
          echo "Waiting for SSH on $SERVER_IP ..."
          for i in $(seq 1 30); do
            if ssh -o StrictHostKeyChecking=no \
                   -o ConnectTimeout=10 \
                   -i /tmp/deploy_key \
                   ubuntu@$SERVER_IP "echo ok" 2>/dev/null; then
              echo "SSH is ready."
              break
            fi
            echo "Attempt $i - retrying in 10 s ..."
            sleep 10
          done

      # -----------------------------------------------------------------------
      # Install Ansible
      # -----------------------------------------------------------------------
      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible

      # -----------------------------------------------------------------------
      # Rsync app source to EC2 (before Ansible runs the service)
      # -----------------------------------------------------------------------
      - name: Rsync app source to EC2
        run: |
          # Create /opt/app on the remote host
          ssh -o StrictHostKeyChecking=no \
              -i /tmp/deploy_key \
              ubuntu@$SERVER_IP \
              "sudo mkdir -p /opt/app && sudo chown ubuntu:ubuntu /opt/app"

          # Sync repo contents (excluding git/CI artefacts)
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='terraform' \
            --exclude='ansible' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='.venv' \
            -e "ssh -o StrictHostKeyChecking=no -i /tmp/deploy_key" \
            ./ ubuntu@$SERVER_IP:/opt/app/

      # -----------------------------------------------------------------------
      # Ansible - configure system packages, venv, systemd, nginx
      # -----------------------------------------------------------------------
      - name: Run Ansible playbook
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          ansible-playbook \
            -i "$SERVER_IP," \
            -u ubuntu \
            --private-key /tmp/deploy_key \
            ansible/playbook.yml

      # -----------------------------------------------------------------------
      # Self-verify - hit /health and fail on non-2xx/3xx
      # -----------------------------------------------------------------------
      - name: Self-verify health endpoint
        run: |
          echo "Verifying http://$SERVER_IP/health ..."
          for i in $(seq 1 12); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
                          --max-time 10 \
                          "http://$SERVER_IP/health" || echo "000")
            echo "Attempt $i - HTTP status: $HTTP_CODE"
            if echo "$HTTP_CODE" | grep -qE '^[23][0-9][0-9]$'; then
              echo "Health check passed (HTTP $HTTP_CODE)."
              exit 0
            fi
            sleep 10
          done
          echo "ERROR: health check never returned 2xx/3xx. Failing deploy."
          exit 1

      # -----------------------------------------------------------------------
      # Cleanup - always destroy on failure (optional: comment out to keep)
      # On success the infra stays up; on failure we tear down to avoid costs.
      # -----------------------------------------------------------------------
      - name: Terraform Destroy (on failure)
        if: failure()
        working-directory: terraform
        run: |-
          terraform destroy -auto-approve \
            -var="project_name=${{ secrets.PROJECT_NAME }}" \
            -var="aws_region=${{ secrets.AWS_REGION }}" \
            -var="public_key=$SSH_PUBLIC_KEY"
